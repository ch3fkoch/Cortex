<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MdForge // Markdown Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="./vendor/marked.min.js"></script>
    <link rel="stylesheet" href="./vendor/prism-tomorrow.min.css">
    <script src="./vendor/prism.min.js"></script>
    <script src="./vendor/prism-python.min.js"></script>
    <script src="./vendor/prism-bash.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="mode-split">

    <div id="app-container">
        <!-- 1. Sidebar (Dateiliste) -->
        <aside id="sidebar" class="bento-card">
            <div class="sidebar-header">
                <div class="brand">MdForge</div>
                <div style="display: flex; gap: 8px;">
                    <button onclick="openDirectory()" class="btn-icon" title="Ordner öffnen">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </button>
                    <button onclick="createNewDoc()" class="btn-icon" title="Neue Datei">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="doc-list"></div>
        </aside>

        <!-- 2. Haupt-Workspace -->
        <div id="workspace-container">
            <!-- 2.1 Workspace Header (Tools & View Mode) -->
            <header>
                <div class="editor-tools">
                    <button onclick="insertAtCursor('**', '**')" class="tool-btn" title="Fett">B</button>
                    <button onclick="insertAtCursor('*', '*')" class="tool-btn" title="Kursiv">I</button>
                    <button onclick="insertAtCursor('[', '](url)')" class="tool-btn" title="Link einfügen">Link</button>
                    <button onclick="insertAtCursor('# ', '')" class="tool-btn">H1</button>
                    <button onclick="insertAtCursor('--- \n', '')" class="tool-btn">—</button>
                    <button onclick="insertTable()" class="tool-btn" title="Tabelle einfügen">Tabelle</button>
                </div>

                <div id="file-title" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 1.5px; color: var(--text-secondary);">KEINE DATEI GEWÄHLT</div>

                <div class="view-controls">
                    <button onclick="setMode('editor')" class="view-btn" id="btn-editor">EDIT</button>
                    <button onclick="setMode('split')" class="view-btn active" id="btn-split">SPLIT</button>
                    <button onclick="setMode('preview')" class="view-btn" id="btn-preview">READ</button>
                </div>
            </header>

            <!-- 2.2 Editor Card -->
            <div id="editor-card" class="bento-card">
                <textarea id="md-input" spellcheck="false" placeholder="Öffne einen Ordner oder erstelle eine neue Datei, um mit dem Schreiben zu beginnen..."></textarea>
            </div>

            <!-- 2.3 Preview Card -->
            <div id="preview-card" class="bento-card">
                <div id="preview-content" class="preview-content"></div>
            </div>

            <!-- 2.4 Rechte Widget-Spalte -->
            <div id="right-sidebar">
                <!-- Text-Metadaten Widget -->
                <div id="metadata-card" class="bento-card">
                    <div class="section-title">Metadaten</div>
                    <div class="meta-grid">
                        <div class="meta-item">
                            <div class="meta-label">Zeichen</div>
                            <div id="stat-chars" class="meta-value">0</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Wörter</div>
                            <div id="stat-words" class="meta-value">0</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Zeilen</div>
                            <div id="stat-lines" class="meta-value">0</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">Lesezeit</div>
                            <div id="stat-readtime" class="meta-value">0 Min</div>
                        </div>
                    </div>
                </div>

                <!-- System-Status Widget -->
                <div id="status-card" class="bento-card">
                    <div class="section-title">System-Status</div>
                    <div class="status-row">
                        <span>Verbindungsmodus</span>
                        <span id="sys-api-status" style="color: var(--cyan); font-weight: bold;">Lokal (Offline)</span>
                    </div>
                    <div class="status-row">
                        <span>Projektname</span>
                        <span id="sys-project" style="color: var(--text-secondary);">MdForge</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. Speichern Banner -->
    <div id="save-status" onclick="saveActiveDoc()">ÄNDERUNGEN SPEICHERN</div>

    <!-- Script Import -->
    <script src="./js/app.js"></script>
</body>
</html>
